name: CI & Quality Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  frontend:
    name: Frontend Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Security Audit
        run: npm audit --audit-level=critical || true
      - name: Build
        run: npm run build

  backend:
    name: Backend Test & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv & dependencies
        run: |
          pip install uv pytest
          cd backend && uv pip install -r requirements.txt --system || pip install -r requirements.txt
      - name: Python Syntax & Tests
        run: |
          cd backend
          python -m compileall app
          pytest || true
